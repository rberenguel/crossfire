<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossfire</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.1.5/pixi.min.js"></script>
    <link href="./fonts/sixtyfour.css" rel="stylesheet" />
    <link href="./fonts/inter.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <style></style>
  </head>
  <body>
    <div id="game-setup-modal" class="modal">
      <div id="rules-modal" class="modal hidden">
        <div class="rules-modal-content">
          <div id="rules-content"></div>
          <button
            id="btn-close-rules"
            class="button action-btn"
            style="margin-top: 1.5rem; width: 100%"
          >
            Close
          </button>
        </div>
      </div>
      <div class="modal-content">
        <h1 class="game-title titlefonted">Crossfire</h1>
        <button id="btn-vs-human" class="button action-btn">
          Human vs. Human
        </button>
        <button id="btn-vs-ai" class="button action-btn end-turn">
          Human vs. Computer
        </button>
        <button id="btn-rules" class="button secondary">View Rules</button>
      </div>
    </div>

    <div class="game-wrapper">
      <div class="top-bar">
        <div class="player-stats">
          <span id="p1-info-top" class="player-info"></span>
          <span id="p2-info-top" class="player-info"></span>
        </div>
        <div class="game-status">
          <span id="game-status">Initializing...</span>
        </div>
      </div>

      <div id="pixi-canvas"></div>

      <div class="actions-container">
        <div id="orientation-panel" class="panel hidden">
          <h3 id="orientation-title">Set Orientation</h3>
          <div class="orient-grid">
            <button class="button orient-btn" data-orient="3">↖</button>
            <button class="button orient-btn" data-orient="2">↑</button>
            <button class="button orient-btn" data-orient="1">↗</button>
            <button class="button orient-btn" data-orient="4">←</button>
            <div></div>
            <button class="button orient-btn" data-orient="0">→</button>
            <button class="button orient-btn" data-orient="5">↙</button>
            <button class="button orient-btn" data-orient="6">↓</button>
            <button class="button orient-btn" data-orient="7">↘</button>
          </div>
        </div>
        <div id="actions-panel" class="panel hidden">
          <h3>Actions (<span id="actions-left">2</span>/2)</h3>
          <div class="button-grid">
            <button id="btn-fire" class="button action-btn">Fire Laser</button>
            <button id="btn-accel" class="button action-btn">Accelerate</button>
            <button id="btn-decel" class="button action-btn">Decelerate</button>
            <button id="btn-turn-left" class="button action-btn">
              Turn Left
            </button>
            <button id="btn-turn-right" class="button action-btn">
              Turn Right
            </button>
            <button id="btn-end-turn" class="button action-btn end-turn">
              End Turn
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="winner-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="winner-text"></h2>
        <button id="btn-restart" class="button action-btn">Play Again</button>
      </div>
    </div>
    <script src="rules.js"></script>
    <script src="ai.js"></script>
    <script src="script.js"></script>
  </body>
</html>
